name: Bootstrap existing repository profiles
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    permissions:
      contents: read
      id-token: none
    uses: tyler180/github-workflows/.github/workflows/repository-bootstrap.yml@4ef89ff9d38025f3c1fee004234a216629880cae
    with:
      automation-sha: 4ef89ff9d38025f3c1fee004234a216629880cae
    secrets:
      TF_GITHUB_BOOTSTRAP_TOKEN: ${{ secrets.TF_GITHUB_BOOTSTRAP_TOKEN }}
