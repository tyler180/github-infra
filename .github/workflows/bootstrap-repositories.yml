name: Bootstrap existing repository profiles
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    permissions:
      contents: read
      id-token: none
    uses: tyler180/github-workflows/.github/workflows/repository-bootstrap.yml@05f1ee3dbe827c6e0812e7c61047c2a1120580eb
    with:
      automation-sha: 05f1ee3dbe827c6e0812e7c61047c2a1120580eb
    secrets:
      TF_GITHUB_BOOTSTRAP_TOKEN: ${{ secrets.TF_GITHUB_BOOTSTRAP_TOKEN }}
