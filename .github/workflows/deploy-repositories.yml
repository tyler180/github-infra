name: Deploy repository pilot
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy repositories or reconcile Terraform state with observed GitHub settings
        type: choice
        default: deploy
        options:
          - deploy
          - reconcile-state
permissions:
  contents: read
  id-token: write
jobs:
  settings-preflight:
    permissions:
      contents: read
      id-token: none
    uses: ./.github/workflows/diagnose-plan-token.yml
    secrets:
      TF_GITHUB_PLAN_TOKEN: ${{ secrets.TF_GITHUB_PLAN_TOKEN }}
  reconcile-state:
    if: inputs.operation == 'reconcile-state'
    needs: settings-preflight
    uses: ./.github/workflows/reconcile-repository-state.yml
    with:
      apply-role-arn: ${{ vars.TF_AWS_APPLY_ROLE_ARN }}
    secrets:
      TF_GITHUB_PLAN_TOKEN: ${{ secrets.TF_GITHUB_PLAN_TOKEN }}
  deploy:
    if: inputs.operation == 'deploy'
    needs: settings-preflight
    uses: tyler180/github-workflows/.github/workflows/repository-create-deploy.yml@v2.1.0-rc.4
    with:
      trusted-policy-ref: v2.1.0-rc.4
      apply-role-arn: ${{ vars.TF_AWS_APPLY_ROLE_ARN }}
      record-writer-role-arn: ${{ vars.TF_AWS_RECORD_WRITER_ROLE_ARN }}
    secrets:
      TF_GITHUB_PLAN_TOKEN: ${{ secrets.TF_GITHUB_PLAN_TOKEN }}
      TF_GITHUB_APPLY_TOKEN: ${{ secrets.TF_GITHUB_APPLY_TOKEN }}
  bootstrap:
    needs: deploy
    permissions:
      contents: read
      id-token: none
    uses: tyler180/github-workflows/.github/workflows/repository-bootstrap.yml@v2.3.0-rc.11
    with:
      automation-ref: v2.3.0-rc.11
    secrets:
      TF_GITHUB_BOOTSTRAP_TOKEN: ${{ secrets.TF_GITHUB_BOOTSTRAP_TOKEN }}
  terraform-starters:
    needs: bootstrap
    permissions:
      contents: read
      id-token: none
    uses: tyler180/github-workflows/.github/workflows/repository-terraform-starter.yml@v2.3.0-rc.4
    with:
      automation-ref: v2.3.0-rc.4
    secrets:
      TF_GITHUB_BOOTSTRAP_TOKEN: ${{ secrets.TF_GITHUB_BOOTSTRAP_TOKEN }}
