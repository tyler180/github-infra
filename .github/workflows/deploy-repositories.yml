name: Deploy repository pilot
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    uses: tyler180/github-workflows/.github/workflows/repository-create-deploy.yml@f5bf6fc59f8954d357e3081ae888ce03a1cec63f
    with:
      trusted-policy-ref: f5bf6fc59f8954d357e3081ae888ce03a1cec63f
      apply-role-arn: ${{ vars.TF_AWS_APPLY_ROLE_ARN }}
      record-writer-role-arn: ${{ vars.TF_AWS_RECORD_WRITER_ROLE_ARN }}
    secrets:
      TF_GITHUB_PLAN_TOKEN: ${{ secrets.TF_GITHUB_PLAN_TOKEN }}
      TF_GITHUB_APPLY_TOKEN: ${{ secrets.TF_GITHUB_APPLY_TOKEN }}
